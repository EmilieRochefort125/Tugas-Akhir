<!DOCTYPE html>
<html>
<head>
    <title>Data Kategori</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

<div class="container">
    <h2>Data Kategori Psikotes</h2>

    <table>
        <tr>
            <th>No</th>
            <th>Nama Kategori</th>
        </tr>
        {% for k in kategori %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ k.nama_kategori }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
